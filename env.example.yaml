# ==============================================================================
# 环境配置文件模版 (env.example.yaml)
# 用途：集中配置本项目的服务监听端口与内网目标网址，免去手动修改代码的麻烦
# 复制此文件为 env.yaml 并在其中修改你的实际配置
# 生效优先级：命令行参数 > 环境变量 > env.yaml > 默认值
# ==============================================================================

# 服务端网络监听地址（host）
# 0.0.0.0：允许局域网/内网其他设备（手机、平板、局域网电脑）访问
# 127.0.0.1：仅允许本机访问
host: 0.0.0.0

# ------------------------------------------------------------------------------
# 静态资源服务（起服CORS.mjs）
# 用途：向酒馆 iframe 提供编译产物（mvu指挥系统/dist 等）
# ------------------------------------------------------------------------------
cors:
  port: 5500
  # 目标网址（可选）：供外部或酒馆访问静态资源的完整基准 URL，留空则根据当前主机/内网 IP 自动推断
  # 例如：url: "http://192.168.1.100:5500"
  url: ""

# ------------------------------------------------------------------------------
# 世界书同步服务（世界书同步服务.mjs）与酒馆助手脚本（同步世界书-酒馆助手脚本.js）
# 用途：向酒馆助手提供 worldbooks/ 分发与 SSE 实时推送
# ------------------------------------------------------------------------------
sync:
  port: 5510
  # 目标网址（可选）：酒馆助手脚本拉取同步服务的完整基准 URL
  # 1. 留空时：酒馆端脚本会自动推断（优先跟随当前酒馆所在内网主机 IP:5510，兜底 127.0.0.1:5510）
  # 2. 填写时：酒馆端脚本优先连接此目标网址
  # 例如：url: "http://192.168.1.100:5510"
  url: ""

# ------------------------------------------------------------------------------
# 兼容扁平写法（如果不习惯嵌套对象，也可直接在此填写）：
# ------------------------------------------------------------------------------
# cors_port: 5500
# sync_port: 5510
# target_url: "http://192.168.1.100:5500"
# sync_url: "http://192.168.1.100:5510"

# ------------------------------------------------------------------------------
# 版本检测与本地更新配置（默认只检测新版本，绝不自动执行更新）
# ------------------------------------------------------------------------------
update:
  # 启动时是否只读检测远端新版本
  check_on_startup: true
  # 架构铁律：默认只检测新版本，绝不自动执行更新（强制保持 false）
  auto_update: false
  # 远端版本清单地址（可选，留空时仅展示本地版本状态）
  manifest_url: ""

